<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Product Review Form – Monday Ogedengbe</title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals. Monday Ogedengbe. Product Review Form">
    <meta name="author" content="Monday Ogedengbe">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <p class="required-note"><span class="required-star">*</span> Required field</p>

            <!-- Product Name -->
            <div class="form-group">
                <label for="product-name">Product Name <span class="required-star">*</span></label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="form-group rating-group">
                <label>Overall Rating <span class="required-star">*</span></label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">&#9733;</label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4" title="4 stars">&#9733;</label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3" title="3 stars">&#9733;</label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2" title="2 stars">&#9733;</label>

                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1" title="1 star">&#9733;</label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="install-date">Date of Installation <span class="required-star">*</span></label>
                <input type="date" id="install-date" name="install-date" required>
            </div>

            <!-- Useful Features -->
            <div class="form-group features-group">
                <label>Which features did you find useful in the product? <span class="hint">(Check all that apply)</span></label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-durability" name="features" value="Durability">
                        <label for="feature-durability">Durability</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-ease" name="features" value="Ease of Use">
                        <label for="feature-ease">Ease of Use</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-performance" name="features" value="Performance">
                        <label for="feature-performance">Performance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-design" name="features" value="Design">
                        <label for="feature-design">Design</label>
                    </div>
                </div>
            </div>

            <!-- Written Review -->
            <div class="form-group">
                <label for="review-text">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review-text" name="review-text" rows="4" placeholder="Share your experience with this product..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="user-name" name="user-name" placeholder="Enter your name">
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <input type="submit" value="Post Review">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> &#127796; Monday Ogedengbe &#127796; Nigeria</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
